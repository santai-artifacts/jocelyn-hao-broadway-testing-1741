<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Broadway NYC — Shows & Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-dim: rgba(201,168,76,0.12);
      --bg: #09090E;
      --s1: #10101A;
      --s2: #16161F;
      --s3: #1C1C28;
      --border: rgba(255,255,255,0.07);
      --text: #EDE9DF;
      --muted: #72728A;
    }

    @keyframes pulse {
      0%   { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: none; }
    }

    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    body { display: flex; flex-direction: column; }

    /* ── Header ── */
    header {
      height: 56px; min-height: 56px;
      background: var(--s1);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 18px; gap: 12px; z-index: 100;
    }
    .logo-icon {
      width: 30px; height: 30px;
      background: linear-gradient(145deg, #D4A840, #7A5C10);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .logo-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 17px; font-weight: 700;
    }
    .logo-title span { color: var(--gold); }
    .header-right {
      margin-left: auto; font-size: 11px; color: var(--muted);
      border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px;
    }

    /* ── Notice ── */
    .notice {
      padding: 5px 16px; flex-shrink: 0;
      background: var(--gold-dim);
      border-bottom: 1px solid rgba(201,168,76,0.12);
      font-size: 11px; color: rgba(201,168,76,0.8);
      text-align: center; line-height: 1.4;
    }

    /* ── Layout ── */
    .main { flex: 1; display: flex; min-height: 0; }

    /* ── Sidebar ── */
    .sidebar {
      width: 350px; min-width: 350px;
      background: var(--s1);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; min-height: 0;
    }

    .controls {
      padding: 11px 11px 9px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }

    /* Search */
    .search-wrap { position: relative; }
    .search-wrap input {
      width: 100%; padding: 8px 10px 8px 32px;
      background: var(--s2); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text);
      font: 13px 'Inter', sans-serif; outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap input:focus { border-color: rgba(201,168,76,0.35); }
    .search-icon {
      position: absolute; left: 9px; top: 50%;
      transform: translateY(-50%);
      width: 13px; height: 13px;
      stroke: var(--muted); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      pointer-events: none;
    }

    /* Filters */
    .filter-row { display: flex; gap: 5px; }
    .filter-btn {
      flex: 1; padding: 5px 4px;
      border: 1px solid var(--border); border-radius: 6px;
      background: transparent; color: var(--muted);
      font: 500 11px 'Inter', sans-serif;
      cursor: pointer; transition: all 0.15s; text-align: center;
    }
    .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
    .filter-btn.active { background: var(--gold); border-color: var(--gold); color: #1a0e00; font-weight: 600; }

    /* List meta */
    .list-meta {
      padding: 7px 13px 3px; flex-shrink: 0;
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--muted);
    }

    /* Scroll list */
    .show-list { flex: 1; overflow-y: auto; min-height: 0; }
    .show-list::-webkit-scrollbar { width: 3px; }
    .show-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

    /* Card */
    .show-card {
      padding: 11px 12px; display: flex; align-items: flex-start; gap: 10px;
      cursor: pointer; border-left: 3px solid transparent;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
      animation: slideIn 0.2s ease both;
    }
    .show-card:hover { background: var(--s2); }
    .show-card.selected { background: rgba(201,168,76,0.05); border-left-color: var(--gold); }

    .card-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .card-body { flex: 1; min-width: 0; }
    .card-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 14px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .card-theater {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .tag {
      font-size: 9.5px; padding: 2px 5px;
      background: var(--s3); border-radius: 3px; color: var(--muted);
    }
    .genre-badge {
      font-size: 9.5px; font-weight: 600;
      padding: 2px 7px; border-radius: 9px;
      flex-shrink: 0; align-self: flex-start; margin-top: 2px;
    }
    .genre-musical { background: rgba(201,168,76,0.12); color: var(--gold); }
    .genre-play { background: rgba(144,164,174,0.1); color: #90A4AE; }

    .empty {
      padding: 48px 20px; text-align: center;
      color: var(--muted); font-size: 13px; line-height: 1.6;
    }
    .empty-icon { font-size: 28px; opacity: 0.3; margin-bottom: 10px; }

    /* ── Map ── */
    #map { flex: 1; min-width: 0; }

    /* ── Leaflet overrides ── */
    .leaflet-container { font-family: 'Inter', sans-serif !important; }
    .leaflet-popup-content-wrapper {
      background: var(--s1) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      box-shadow: 0 16px 48px rgba(0,0,0,0.8) !important;
    }
    .leaflet-popup-tip { background: var(--s1) !important; }
    .leaflet-popup-content { margin: 0 !important; color: var(--text) !important; }
    .leaflet-popup-close-button {
      color: var(--muted) !important;
      top: 9px !important; right: 11px !important;
      font-size: 20px !important; line-height: 1 !important;
    }
    .leaflet-popup-close-button:hover { color: var(--text) !important; background: none !important; }
    .leaflet-control-zoom { border: 1px solid var(--border) !important; border-radius: 8px !important; overflow: hidden; }
    .leaflet-control-zoom a { background: var(--s1) !important; color: var(--muted) !important; border-bottom-color: var(--border) !important; }
    .leaflet-control-zoom a:hover { background: var(--s2) !important; color: var(--text) !important; }
    .leaflet-control-attribution { background: rgba(9,9,14,0.75) !important; color: var(--muted) !important; font-size: 10px !important; }
    .leaflet-control-attribution a { color: var(--gold) !important; }

    /* Popup content */
    .popup-inner { padding: 16px 18px 18px; min-width: 210px; max-width: 270px; }
    .popup-genre { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--gold); margin-bottom: 3px; }
    .popup-title { font-family: 'Playfair Display', Georgia, serif; font-size: 16px; font-weight: 700; margin-bottom: 3px; }
    .popup-theater { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .popup-desc { font-size: 12px; line-height: 1.6; color: rgba(237,233,223,0.75); }
    .popup-tags { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      body { overflow: auto; }
      .main { flex-direction: column; overflow: visible; }
      .sidebar { width: 100%; min-width: unset; height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
      #map { height: 55vw; min-height: 320px; flex: none; }
      .header-right { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-icon">🎭</div>
  <div class="logo-title">Broadway <span>NYC</span></div>
  <div class="header-right">Theater District · Midtown Manhattan</div>
</header>

<div class="notice">
  Show data reflects early 2025 — schedules change frequently. Always confirm with official box offices before purchasing tickets.
</div>

<div class="main">
  <div class="sidebar">
    <div class="controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="searchInput" placeholder="Search shows or theaters…" autocomplete="off" />
      </div>
      <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-genre="all">All Shows</button>
        <button class="filter-btn" data-genre="Musical">Musicals</button>
        <button class="filter-btn" data-genre="Play">Plays</button>
      </div>
    </div>
    <div class="list-meta" id="listMeta"></div>
    <div class="show-list" id="showList"></div>
  </div>
  <div id="map"></div>
</div>

<script>
const SHOWS = [
  {
    id: 1, title: "Hamilton",
    theater: "Richard Rodgers Theatre", address: "226 W 46th St",
    lat: 40.7601, lng: -73.9853,
    genre: "Musical", tags: ["Hip-Hop","Historical","Drama"],
    description: "Lin-Manuel Miranda's groundbreaking musical retelling the life of Founding Father Alexander Hamilton through a hip-hop score.",
    color: "#C9A84C"
  },
  {
    id: 2, title: "The Lion King",
    theater: "Minskoff Theatre", address: "200 W 45th St",
    lat: 40.7584, lng: -73.9857,
    genre: "Musical", tags: ["Family","Spectacle","Classic"],
    description: "Julie Taymor's visionary production follows young Simba across the African savanna. Broadway's longest-running Disney musical.",
    color: "#E8793A"
  },
  {
    id: 3, title: "Chicago",
    theater: "Ambassador Theatre", address: "219 W 49th St",
    lat: 40.7611, lng: -73.9896,
    genre: "Musical", tags: ["Jazz","Comedy","Dark"],
    description: "The world's longest-running American musical revival. Murder, jazz, and razzle dazzle in Prohibition-era Chicago.",
    color: "#E84545"
  },
  {
    id: 4, title: "Hadestown",
    theater: "Walter Kerr Theatre", address: "219 W 48th St",
    lat: 40.7608, lng: -73.9890,
    genre: "Musical", tags: ["Folk","Mythology","Dark"],
    description: "Anaïs Mitchell's Tony Award-winning retelling of the Orpheus & Eurydice myth through a haunting folk-jazz score.",
    color: "#8B6FCB"
  },
  {
    id: 5, title: "Hell's Kitchen",
    theater: "Shubert Theatre", address: "225 W 44th St",
    lat: 40.7580, lng: -73.9875,
    genre: "Musical", tags: ["R&B","Coming-of-Age","Alicia Keys"],
    description: "Set in 1990s New York, a jukebox musical built around Alicia Keys's iconic catalog — a story of identity and first love.",
    color: "#FF6B6B"
  },
  {
    id: 6, title: "The Outsiders",
    theater: "Bernard B. Jacobs Theatre", address: "242 W 45th St",
    lat: 40.7589, lng: -73.9875,
    genre: "Musical", tags: ["Rock","Drama","Adaptation"],
    description: "S.E. Hinton's beloved novel transformed into a visceral, rock-infused musical about class, loyalty, and brotherhood.",
    color: "#4ECDC4"
  },
  {
    id: 7, title: "Sunset Boulevard",
    theater: "St. James Theatre", address: "246 W 44th St",
    lat: 40.7578, lng: -73.9879,
    genre: "Musical", tags: ["Drama","Classic","Revival"],
    description: "Andrew Lloyd Webber's dark tale of a faded Hollywood star's obsession. 2024 revival starring Nicole Scherzinger.",
    color: "#D4A017"
  },
  {
    id: 8, title: "Water for Elephants",
    theater: "Imperial Theatre", address: "249 W 45th St",
    lat: 40.7591, lng: -73.9863,
    genre: "Musical", tags: ["Circus","Romance","Spectacle"],
    description: "Based on Sara Gruen's bestselling novel — a Depression-era circus love story with breathtaking acrobatics.",
    color: "#42A5F5"
  },
  {
    id: 9, title: "Gypsy",
    theater: "Majestic Theatre", address: "245 W 44th St",
    lat: 40.7579, lng: -73.9862,
    genre: "Musical", tags: ["Revival","Classic","Drama"],
    description: "Jule Styne's landmark musical featuring Audra McDonald as the fiercely ambitious stage mother, Mama Rose.",
    color: "#EC407A"
  },
  {
    id: 10, title: "Suffs",
    theater: "Music Box Theatre", address: "239 W 45th St",
    lat: 40.7590, lng: -73.9872,
    genre: "Musical", tags: ["Historical","Political","Feminist"],
    description: "Shaina Taub's acclaimed musical tracing the fierce, complex women who fought for the American right to vote.",
    color: "#AB47BC"
  },
  {
    id: 11, title: "Appropriate",
    theater: "Belasco Theatre", address: "111 W 44th St",
    lat: 40.7578, lng: -73.9898,
    genre: "Play", tags: ["Drama","Family","Pulitzer"],
    description: "Branden Jacobs-Jenkins's Pulitzer Prize-winning play about a Southern family reckoning with a troubling inheritance.",
    color: "#90A4AE"
  },
  {
    id: 12, title: "Stereophonic",
    theater: "Golden Theatre", address: "252 W 45th St",
    lat: 40.7591, lng: -73.9882,
    genre: "Play", tags: ["Drama","Music","Ensemble","Pulitzer"],
    description: "David Adjmi's Pulitzer Prize-winning epic following a rock band recording a landmark album in the 1970s.",
    color: "#78909C"
  },
  {
    id: 13, title: "Maybe Happy Ending",
    theater: "Belasco Theatre", address: "111 W 44th St",
    lat: 40.75775, lng: -73.9900,
    genre: "Musical", tags: ["Romance","Sci-Fi","Intimate"],
    description: "A tender musical about two helper-bots who fall in love in a future Seoul. A delicate, beautiful chamber piece.",
    color: "#80CBC4"
  },
  {
    id: 14, title: "Cabaret",
    theater: "August Wilson Theatre", address: "245 W 52nd St",
    lat: 40.7630, lng: -73.9858,
    genre: "Musical", tags: ["Revival","Cabaret","Dark"],
    description: "An immersive reimagining of Kander & Ebb's classic at the Kit Kat Club — winner of multiple Tony Awards.",
    color: "#FF8F00"
  }
];

/* ── State ── */
let selectedId = null;
let activeGenre = 'all';
let query = '';
const markers = {};
let map;

/* ── Filtered list ── */
const visible = () => SHOWS.filter(s => {
  const gOk = activeGenre === 'all' || s.genre === activeGenre;
  const q = query.toLowerCase();
  const sOk = !q || s.title.toLowerCase().includes(q)
    || s.theater.toLowerCase().includes(q)
    || s.tags.some(t => t.toLowerCase().includes(q));
  return gOk && sOk;
});

/* ── Marker icon ── */
function mkIcon(show, active = false) {
  const sz = active ? 20 : 13;
  const ringHtml = active
    ? `<div style="position:absolute;width:${sz + 14}px;height:${sz + 14}px;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid ${show.color};animation:pulse 1.7s ease-out infinite;pointer-events:none;"></div>`
    : '';
  return L.divIcon({
    className: '',
    html: `<div style="position:relative;width:${sz}px;height:${sz}px;">
      ${ringHtml}
      <div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${show.color};border:2px solid rgba(255,255,255,${active ? 0.9 : 0.5});box-shadow:0 0 ${active ? 14 : 6}px ${show.color}80,0 2px 6px rgba(0,0,0,0.6);"></div>
    </div>`,
    iconSize: [sz, sz],
    iconAnchor: [sz / 2, sz / 2],
    popupAnchor: [0, -(sz / 2 + 9)]
  });
}

/* ── Popup HTML ── */
function mkPopup(s) {
  return `<div class="popup-inner">
    <div class="popup-genre">${s.genre}</div>
    <div class="popup-title">${s.title}</div>
    <div class="popup-theater">📍 ${s.theater} · ${s.address}</div>
    <div class="popup-desc">${s.description}</div>
    <div class="popup-tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
  </div>`;
}

/* ── Render sidebar ── */
function render() {
  const shows = visible();
  document.getElementById('listMeta').textContent =
    `${shows.length} show${shows.length !== 1 ? 's' : ''}`;

  const list = document.getElementById('showList');
  if (!shows.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>No shows match your search.</div>`;
    return;
  }

  list.innerHTML = shows.map((s, i) => `
    <div class="show-card ${selectedId === s.id ? 'selected' : ''}" data-id="${s.id}" style="animation-delay:${i * 22}ms">
      <div class="card-dot" style="background:${s.color};box-shadow:0 0 5px ${s.color}70"></div>
      <div class="card-body">
        <div class="card-name">${s.title}</div>
        <div class="card-theater">${s.theater}</div>
        <div class="card-tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <span class="genre-badge genre-${s.genre.toLowerCase()}">${s.genre}</span>
    </div>
  `).join('');

  list.querySelectorAll('.show-card').forEach(el =>
    el.addEventListener('click', () => select(+el.dataset.id))
  );
}

/* ── Sync map markers ── */
function syncMarkers() {
  const vis = new Set(visible().map(s => s.id));
  SHOWS.forEach(s => {
    const m = markers[s.id];
    if (!m) return;
    if (vis.has(s.id)) {
      if (!map.hasLayer(m)) m.addTo(map);
      m.setIcon(mkIcon(s, s.id === selectedId));
    } else {
      if (map.hasLayer(m)) map.removeLayer(m);
    }
  });
}

/* ── Select a show ── */
function select(id) {
  if (selectedId === id) {
    const prev = SHOWS.find(s => s.id === id);
    if (markers[id]) markers[id].setIcon(mkIcon(prev, false));
    selectedId = null;
    map.closePopup();
    render();
    return;
  }
  if (selectedId !== null) {
    const prev = SHOWS.find(s => s.id === selectedId);
    if (markers[selectedId]) markers[selectedId].setIcon(mkIcon(prev, false));
  }
  selectedId = id;
  render();
  const show = SHOWS.find(s => s.id === id);
  if (!show) return;
  markers[id]?.setIcon(mkIcon(show, true));
  markers[id]?.openPopup();
  map.flyTo([show.lat, show.lng], 16, { animate: true, duration: 0.7 });
  requestAnimationFrame(() => {
    document.querySelector(`.show-card[data-id="${id}"]`)
      ?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

/* ── Init map ── */
function initMap() {
  map = L.map('map', { center: [40.7590, -73.9873], zoom: 15 });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd', maxZoom: 20
  }).addTo(map);

  SHOWS.forEach(show => {
    const m = L.marker([show.lat, show.lng], { icon: mkIcon(show) })
      .addTo(map)
      .bindPopup(mkPopup(show), { maxWidth: 300 });
    m.on('click', () => select(show.id));
    m.on('popupclose', () => {
      if (selectedId === show.id) {
        selectedId = null;
        m.setIcon(mkIcon(show, false));
        render();
      }
    });
    markers[show.id] = m;
  });
}

/* ── Events ── */
document.getElementById('filterRow').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeGenre = btn.dataset.genre;
  selectedId = null;
  render();
  syncMarkers();
});

document.getElementById('searchInput').addEventListener('input', e => {
  query = e.target.value.trim();
  selectedId = null;
  render();
  syncMarkers();
});

/* ── Boot ── */
initMap();
